[tool.black]
line-length = 120
exclude = "venv*"
target-version = ['py311']


[tool.ruff]
line-length = 300

# Ignore `E501` line length in the `scripts` folder
[tool.ruff.lint.extend-per-file-ignores]
"scripts/*" = ["E501"]



[tool.pyright]
exclude = ["utils.py", "venv", "scripts/cot_sankey.py", "scripts/load_alpaca_dataset.py"]

strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportFunctionMemberAccess = true
reportUnknownParameterType = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportInconsistentConstructorType = true
reportOverlappingOverload = true
reportConstantRedefinition = true
reportImportCycles = true
reportPropertyTypeMismatch = true
reportMissingTypeArgument = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true
reportUnusedExpression = true
reportMatchNotExhaustive = true
reportShadowedImports = true
reportPrivateImportUsage = false


[tool.pytest.ini_options]
testpaths = ["tests"]
# Default loop runs the offline subset; opt into live/heavy tests with e.g.
#   pytest -m tinker        (just the tinker-SDK tests)
#   pytest -m ""            (everything, including network/gpu/tinker)
# --strict-markers surfaces typo'd markers instead of silently registering them.
addopts = "-m 'not network and not gpu and not tinker' --strict-markers"
markers = [
    "network: hits a live external API (OpenAI/Anthropic/HTTP) — excluded by default",
    "gpu: requires a GPU — excluded by default",
    "tinker: needs the live Tinker service or a checkpoint — excluded by default",
    "slow: takes more than a few seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]