# BCT (SFT) on Qwen/Qwen3.6-35B-A3B (renderer override → qwen3_5)
# Bias: distractor_argument_g4 only, on logiqa + hellaswag (1024 each), non_cot
# + 2048 instruct samples mixed in
# Training: bs=128, ~32 steps, save_every=16 (midway); final checkpoint evaluated
# Eval skips are_you_sure bias (per user request).

name: bct_da_qwen
model: Qwen/Qwen3.6-35B-A3B

data_generation:
  script: generate_bct_from_test
  args:
    bias: distractor_argument_g4
    datasets: [logiqa, hellaswag]
    limits: [1024, 1024]
    max_tokens: 24576
    temperature: 1.0
    batch_size: 64
    non_cot: true
    output_dir: dataset_dumps/train-from-test-logiqa-hellaswag/da-g4/qwen3-6-35b-a3b

data_preparation:
  enabled: true
  args:
    inputs:
      - "dataset_dumps/train-from-test-logiqa-hellaswag/da-g4/qwen3-6-35b-a3b/bct_non_cot.jsonl"
      - "dataset_dumps/train_seed_42/gpt-oss-120b/instruct_samples.jsonl:2048"
    control_inputs:
      - "dataset_dumps/train-from-test-logiqa-hellaswag/da-g4/qwen3-6-35b-a3b/control_non_cot.jsonl"
      - "dataset_dumps/train_seed_42/gpt-oss-120b/instruct_samples.jsonl:2048"
    shuffle: true
    seed: 42
    clean: true
    output: dataset_dumps/train-from-test-logiqa-hellaswag/da-g4/qwen3-6-35b-a3b/bct_non_cot_instruct.jsonl
    control_output: dataset_dumps/train-from-test-logiqa-hellaswag/da-g4/qwen3-6-35b-a3b/control_non_cot_instruct.jsonl

training:
  method: sft
  seeds: [0, 42, 123]
  include_control: false
  args:
    experiment_name: bct_da_qwen
    run_name: qwen3-6-35b-a3b-bct-da
    data: auto
    batch_size: 128
    epochs: 1
    lr: 2.86e-4
    lora_rank: 8
    save_every: 16

evaluation:
  include_base: false
  args:
    bias_types: "suggested_answer,distractor_fact,distractor_argument_g4,post_hoc,spurious_few_shot_squares,wrong_few_shot"
    datasets: hle
    prompt_styles: no_cot
    limit: 100
    max_tokens: 24576
    max_tasks: 50
    log_dir: artifacts/eval_suites/consistency_hle_qwen/eval_logs
    base_model: Qwen/Qwen3.6-35B-A3B
    renderer: qwen3_5

analysis:
  args:
    bir: true
    ba: true
    plot: true
    variance_across: seed

viz_registration:
  dir_suffix: bct-da
  display_name: "BCT (DA)"
  color: "#2171b5"
  control_color: "#bdd7e7"
  training_biases: [distractor_argument_g4]
