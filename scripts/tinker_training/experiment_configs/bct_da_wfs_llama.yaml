# BCT (SFT) on Llama-3.1-8B-Instruct
# Biases: distractor_argument_g4 + wrong_few_shot, each on logiqa + hellaswag (1024 per combo)
# + 2048 instruct samples mixed in (main only; control uses raw unbiased files)
# Training: bs=128, ~48 steps, save_every=24 (midway); final checkpoint evaluated

name: bct_da_wfs_llama
model: meta-llama/Llama-3.1-8B-Instruct

data_generation:
  - script: generate_bct_from_test
    args:
      bias: distractor_argument_g4
      datasets: [logiqa, hellaswag]
      limits: [1024, 1024]
      max_tokens: 16384
      temperature: 1.0
      batch_size: 64
      output_dir: dataset_dumps/train-from-test-logiqa-hellaswag/da-g4-wfs/da-g4/llama_3_1_8b_instruct
  - script: generate_bct_from_test
    args:
      bias: wrong_few_shot
      datasets: [logiqa, hellaswag]
      limits: [1024, 1024]
      max_tokens: 16384
      temperature: 1.0
      batch_size: 64
      output_dir: dataset_dumps/train-from-test-logiqa-hellaswag/da-g4-wfs/wfs/llama_3_1_8b_instruct

data_preparation:
  enabled: true
  args:
    inputs:
      - "dataset_dumps/train-from-test-logiqa-hellaswag/da-g4-wfs/da-g4/llama_3_1_8b_instruct/bct_cot.jsonl"
      - "dataset_dumps/train-from-test-logiqa-hellaswag/da-g4-wfs/wfs/llama_3_1_8b_instruct/bct_cot.jsonl"
      - "dataset_dumps/train_seed_42/llama-3-1-8b-instruct/instruct_samples.jsonl:2048"
    control_inputs:
      - "dataset_dumps/train-from-test-logiqa-hellaswag/da-g4-wfs/da-g4/llama_3_1_8b_instruct/control_cot.jsonl"
      - "dataset_dumps/train-from-test-logiqa-hellaswag/da-g4-wfs/wfs/llama_3_1_8b_instruct/control_cot.jsonl"
      - "dataset_dumps/train_seed_42/llama-3-1-8b-instruct/instruct_samples.jsonl:2048"
    shuffle: true
    seed: 42
    output: dataset_dumps/train-from-test-logiqa-hellaswag/da-g4-wfs/llama_3_1_8b_instruct/bct_cot_instruct.jsonl
    control_output: dataset_dumps/train-from-test-logiqa-hellaswag/da-g4-wfs/llama_3_1_8b_instruct/control_cot_instruct.jsonl

training:
  method: sft
  seeds: [0, 42, 123]
  include_control: true
  data_mode: concat  # control uses both control_cot.jsonl files concatenated
  args:
    experiment_name: bct_da_wfs_llama
    run_name: llama-bct-da-wfs
    data: auto
    batch_size: 128
    epochs: 1
    lora_rank: 8
    lr: 1.0e-4
    save_every: 24  # midway for main (~48 steps)

evaluation:
  include_base: false
  args:
    bias_types: "suggested_answer,are_you_sure,distractor_fact,distractor_argument_g4,post_hoc,spurious_few_shot_squares,wrong_few_shot"
    datasets: hle
    prompt_styles: cot
    limit: 100
    max_tokens: 16384
    max_tasks: 50
    log_dir: artifacts/eval_suites/consistency_hle_llama/eval_logs
    base_model: meta-llama/Llama-3.1-8B-Instruct

analysis:
  args:
    bir: true
    ba: true
    plot: true
    variance_across: seed

viz_registration:
  dir_suffix: bct-da-wfs
  display_name: "BCT (DA+WFS)"
  color: "#6baed6"
  control_color: "#c6dbef"
  training_biases: [distractor_argument_g4, wrong_few_shot]
