# Paper-regime 3-model comparison — BARE faithful estimator (normalizer=none, z=0)
# Identical to paper_grpo.yaml except advantage_estimator + LR.
# A = -gap*(T-p), no division, no floor. batch=4 averaging (16 steps) is the stabilizer
# that batch=1 lacked (bare degenerated twice at batch=1).
# LR: __LR_PLACEHOLDER__ (see approval message)

name: paper-bare
model: meta-llama/Llama-3.1-8B-Instruct

training:
  method: rl
  include_control: false
  args:
    experiment_name: rlct_paper
    run_name: llama-rmct-da-bare
    bias_types: distractor_argument_g4
    datasets: "logiqa,hellaswag"
    n_datapoints: 64
    lr: 2.0e-3
    lora_rank: 8
    kl_coef: 0.05
    anchor_weight: 0.0
    loss_fn: ppo
    advantage_estimator: shrinkage
    shrinkage_normalizer: none
    shrinkage_z: 0.0
    n_ref_rollouts: 128
    n_train_rollouts: 128
    n_consistency_rollouts: 128
    temperature: 1.0
    max_new_tokens: 20480
    batch_size: 4
    refresh_every: 1
    checkpoint_every: 16

evaluation:
  include_base: false   # base eval handled once by paper_grpo (shared log_dir)
  args:
    bias_types: "distractor_argument_g4,suggested_answer,distractor_fact,wrong_few_shot,spurious_few_shot_squares,post_hoc"
    datasets: hle
    prompt_styles: cot
    limit: 200
    log_dir: sycophancy_eval_inspect/logs/paper_regime

analysis:
  args:
    bir: true
    ba: true
    plot: true

viz_registration:
  dir_suffix: rmct-da-bare
  display_name: "RMCT DA (Bare)"
  color: "#08519c"
  training_biases: [distractor_argument_g4]
