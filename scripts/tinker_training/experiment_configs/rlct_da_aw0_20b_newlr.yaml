# RLCT on gpt-oss-20b — re-run with lr=2.86e-4 and max_new_tokens=24576.
# Otherwise identical to rlct_da_aw0_20b.yaml.

name: rlct_da_aw0_20b_newlr
model: openai/gpt-oss-20b

training:
  method: rl
  seeds: [0, 42, 123]
  include_control: true
  args:
    experiment_name: rlct_da_aw0_20b_newlr
    run_name: gpt-oss-20b-rlct-da-aw0-newlr
    bias_types: "distractor_argument_g4"
    datasets: "logiqa,hellaswag"
    n_datapoints: 64
    prompt_style: no_cot
    lr: 2.86e-4
    lr_schedule: constant
    lora_rank: 8
    kl_coef: 0.05
    anchor_weight: 0.0
    anchor_model: base
    loss_fn: ppo
    n_ref_rollouts: 32
    n_train_rollouts: 32
    n_consistency_rollouts: 32
    n_anchor_rollouts: 32
    temperature: 1.0
    max_new_tokens: 24576
    n_epochs: 1
    batch_size: 8
    gradient_accumulation_steps: 1
    refresh_every: 1
    checkpoint_every: 8

evaluation:
  include_base: false
  args:
    bias_types: "suggested_answer,distractor_fact,distractor_argument_g4,post_hoc,spurious_few_shot_squares,wrong_few_shot"
    datasets: hle
    prompt_styles: no_cot
    limit: 100
    max_tokens: 24576
    max_tasks: 50
    log_dir: artifacts/eval_suites/consistency_hle_20b/eval_logs
    base_model: openai/gpt-oss-20b

analysis:
  args:
    bir: true
    ba: true
    plot: true
    variance_across: seed

viz_registration:
  dir_suffix: rlct-da-aw0-newlr
  display_name: "RLCT (DA, aw=0, newlr)"
  color: "#006d2c"
  control_color: "#bae4b3"
  training_biases: [distractor_argument_g4]
