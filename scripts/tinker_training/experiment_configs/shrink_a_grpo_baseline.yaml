# Shrinkage experiment — Config A: GRPO baseline (control for the comparison)
# Current advantage estimator (std-normalized). Apples-to-apples vs Config B.
# Train MMLU suggested_answer, eval TruthfulQA (5 biases, 200 samples).
# 128 datapoints, batch=1 -> 128 steps. Total gens: 128 dp * 128 gen/dp = 16384.

name: shrink-a-grpo
model: meta-llama/Llama-3.1-8B-Instruct

training:
  method: rl
  include_control: false
  args:
    experiment_name: rlct_shrinkage
    run_name: llama-rlct-sa-grpo
    bias_types: suggested_answer
    datasets: mmlu
    n_datapoints: 128
    lora_rank: 8
    kl_coef: 0.05
    anchor_weight: 0.0
    loss_fn: ppo
    advantage_estimator: grpo_normalized
    n_ref_rollouts: 64
    n_train_rollouts: 64
    n_consistency_rollouts: 16
    refresh_every: 1
    batch_size: 1
    checkpoint_every: 64

evaluation:
  include_base: true
  args:
    bias_types: "suggested_answer,distractor_argument,distractor_fact,wrong_few_shot,spurious_few_shot_squares"
    datasets: truthfulqa
    prompt_styles: cot
    limit: 200
    log_dir: sycophancy_eval_inspect/logs/shrinkage_exp

analysis:
  args:
    bir: true
    ba: true
    plot: true

viz_registration:
  dir_suffix: rlct-sa-grpo
  display_name: "RLCT SA (GRPO)"
  color: "#969696"
  training_biases: [suggested_answer]
