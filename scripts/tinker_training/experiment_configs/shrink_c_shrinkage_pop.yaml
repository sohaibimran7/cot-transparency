# Shrinkage experiment — Config C: shrinkage + population averaging
# Same shrinkage estimator as B, but batch_size=8 so each gradient step averages
# the (unnormalized) shrunk-gap signal over 8 datapoints instead of 1.
# Same total compute as A/B: 128 dp * 128 gen/dp = 16384 gens, now over 16 steps.

name: shrink-c-shrink-pop
model: meta-llama/Llama-3.1-8B-Instruct

training:
  method: rl
  include_control: false
  args:
    experiment_name: rlct_shrinkage
    run_name: llama-rlct-sa-shrink-pop
    bias_types: suggested_answer
    datasets: mmlu
    n_datapoints: 128
    lora_rank: 8
    kl_coef: 0.05
    anchor_weight: 0.0
    loss_fn: ppo
    advantage_estimator: shrinkage
    shrinkage_mode: soft
    shrinkage_z: 2.0
    n_ref_rollouts: 64
    n_train_rollouts: 64
    n_consistency_rollouts: 16
    refresh_every: 1
    batch_size: 8
    checkpoint_every: 8

evaluation:
  include_base: false   # base eval handled once by Config A (shared log_dir)
  args:
    bias_types: "suggested_answer,distractor_argument,distractor_fact,wrong_few_shot,spurious_few_shot_squares"
    datasets: truthfulqa
    prompt_styles: cot
    limit: 200
    log_dir: sycophancy_eval_inspect/logs/shrinkage_exp

analysis:
  args:
    bir: true
    ba: true
    plot: true

viz_registration:
  dir_suffix: rlct-sa-shrink-pop
  display_name: "RLCT SA (Shrink+Pop)"
  color: "#41ab5d"
  training_biases: [suggested_answer]
