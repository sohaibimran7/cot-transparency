# BCT batch_size sweep: bs=256
name: sweep-bct-bs-256
model: meta-llama/Llama-3.1-8B-Instruct

training:
  method: sft
  include_control: false
  args:
    experiment_name: sweep-bct-batch-size
    run_name: llama-bct-bs256
    data: [dataset_dumps/train_seed_42/llama-3-1-8b-instruct/sa-mmlu-hp/bct_cot.jsonl]
    batch_size: 256
    epochs: 1
    lora_rank: 8
    save_every: 9999

evaluation:
  include_base: true
  args:
    bias_types: "suggested_answer,distractor_argument,distractor_fact,wrong_few_shot,spurious_few_shot_squares"
    datasets: truthfulqa
    prompt_styles: cot
    limit: 200
    log_dir: sycophancy_eval_inspect/logs/tinker_evals

analysis:
  args:
    bir: true
    plot: true

viz_registration:
  dir_suffix: bct-bs256
  display_name: "BCT bs=256"
  color: "#984ea3"
  training_biases: [suggested_answer]
