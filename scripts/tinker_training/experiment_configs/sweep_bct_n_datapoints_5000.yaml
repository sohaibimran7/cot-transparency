# BCT n_datapoints sweep: 5000 samples (from MMLU 7K dataset)
# Per Sohaib (Apr 21 meeting): extend to 5000 using the larger MMLU set.
# Note: nd=5000 uses a different sampled subset than nd=500/1000/2000
# (generated from mmlu_7000samples, not the original 2000-sample mmlu).
name: sweep-bct-nd-5000
model: meta-llama/Llama-3.1-8B-Instruct

training:
  method: sft
  include_control: false
  args:
    experiment_name: sweep-bct-n-datapoints
    run_name: llama-bct-nd5000
    data:
      - "dataset_dumps/train_seed_42/llama-3-1-8b-instruct/sa-mmlu-hp-5k/bct_cot.jsonl:5000"
    batch_size: 128
    epochs: 1
    lora_rank: 8
    save_every: 9999

evaluation:
  include_base: true
  args:
    bias_types: "suggested_answer,distractor_argument,distractor_fact,wrong_few_shot,spurious_few_shot_squares"
    datasets: truthfulqa
    prompt_styles: cot
    limit: 200
    log_dir: sycophancy_eval_inspect/logs/tinker_evals

analysis:
  args:
    bir: true
    plot: true

viz_registration:
  dir_suffix: bct-nd5000
  display_name: "BCT nd=5000"
  color: "#984ea3"
  training_biases: [suggested_answer]
