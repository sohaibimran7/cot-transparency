# BCT instruct sweep: BCT only (no instruct mixing)
name: sweep-bct-no-instruct
model: meta-llama/Llama-3.1-8B-Instruct

training:
  method: sft
  include_control: false
  args:
    experiment_name: sweep-bct-instruct
    run_name: llama-bct-noinst
    data: [dataset_dumps/train_seed_42/llama-3-1-8b-instruct/sa-mmlu-hp/bct_cot.jsonl]
    batch_size: 128
    epochs: 1
    lora_rank: 8
    save_every: 9999

evaluation:
  include_base: true
  args:
    bias_types: "suggested_answer,distractor_argument,distractor_fact,wrong_few_shot,spurious_few_shot_squares"
    datasets: truthfulqa
    prompt_styles: cot
    limit: 200
    log_dir: sycophancy_eval_inspect/logs/tinker_evals

analysis:
  args:
    bir: true
    plot: true

viz_registration:
  dir_suffix: bct-noinst
  display_name: "BCT (no instruct)"
  color: "#377eb8"
  training_biases: [suggested_answer]
