# N datapoints sweep: n_datapoints=128 (default)
name: sweep-nd-128
model: meta-llama/Llama-3.1-8B-Instruct

training:
  method: rl
  include_control: false
  args:
    experiment_name: sweep-n-datapoints
    run_name: llama-rlct-nd128
    bias_types: suggested_answer
    datasets: mmlu
    n_datapoints: 128
    lora_rank: 8
    kl_coef: 0.05
    anchor_weight: 0.0
    loss_fn: ppo
    n_ref_rollouts: 64
    n_train_rollouts: 64
    n_consistency_rollouts: 16
    refresh_every: 1
    batch_size: 1
    checkpoint_every: 64

evaluation:
  include_base: true
  args:
    bias_types: "suggested_answer,distractor_argument,distractor_fact,wrong_few_shot,spurious_few_shot_squares"
    datasets: truthfulqa
    prompt_styles: cot
    limit: 200
    log_dir: sycophancy_eval_inspect/logs/tinker_evals

analysis:
  args:
    bir: true
    plot: true

viz_registration:
  dir_suffix: rlct-nd128
  display_name: "RLCT nd=128"
  color: "#ff7f00"
  training_biases: [suggested_answer]
