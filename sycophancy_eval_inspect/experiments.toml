# Single source of truth for the visualization layer.
#
# - [biases.X]            — bias type metadata
# - [models.X]            — model family metadata (display name, dir prefix, prompt styles)
# - [training_types.X]    — per-training-run color, training biases, etc.
# - [ordering]            — ordered list of training_types for x-axis sort
# - [aggregate_names]     — display names for aggregate-mode groups
#
# Per-experiment training types are also auto-discovered from
# `viz_registration:` blocks in `scripts/tinker_training/experiment_configs/*.yaml`.
# This TOML is the place for global config (biases, models) and for legacy
# entries that don't have a corresponding YAML.

# ── Biases ────────────────────────────────────────────────────────────────
[biases.suggested_answer]
display_name = "Suggested Answer"
publication_label = "Suggested\nAnswer"

[biases.wrong_few_shot]
display_name = "Wrong Few-Shot"
publication_label = "Wrong\nFew-Shot"

[biases.distractor_argument]
display_name = "Distractor Argument"
publication_label = "Distractor\nArgument"

[biases.distractor_argument_g4]
display_name = "Distractor Argument"
publication_label = "Distractor\nArgument"

[biases.distractor_fact]
display_name = "Distractor Fact"
publication_label = "Distractor\nFact"

[biases.spurious_few_shot_hindsight]
display_name = "Spurious: Hindsight"
publication_label = "Spurious:\nHindsight"

[biases.spurious_few_shot_squares]
display_name = "Spurious: Squares"
publication_label = "Spurious:\nSquares"

[biases.post_hoc]
display_name = "Post-Hoc"
publication_label = "Post-Hoc"

[biases.are_you_sure]
display_name = "Are You Sure?"
publication_label = "Are You\nSure?"

